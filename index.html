function loginUI(msg){const first=!U.length;
 shell(`<div id="lg"><div class="lc"><img class="av" src="${AV}" alt="Doctor"><h1>${esc(S().clinic)}</h1>${ECG}<p>${first?'First-time setup: create the admin account':'Sign in to continue'}</p>

function fgUI(msg){rcOK=false;shell(LC('Enter the reset code to continue',`<label>Reset code<input id="fgc" type="password" autocapitalize="none"></label><div class="err" id="le">${esc(msg||'')}</div><button class="btn w" onclick="fg1()">Continue</button>`))}

function patCsv(){dlText('patients-'+day()+'.csv',csvT([['MR','Name','Father/Husband','Phone','CNIC','Age','Gender','Blood group','Allergy','Address','Visits','Last visit']].concat(P.slice().sort((a,b)=>a.mr>b.mr?1:-1).map(p=>{const vs=V.filter(v=>v.mr===p.mr);return [p.mr,p.name,p.fh,p.ph,p.cnic,p.age,p.g,p.bg,p.allergy,p.addr,vs.length,vs.length?vs[0].day:'']}))))}
function visCsv(){dlText('visits-'+day()+'.csv',csvT([['Token','Date','MR','Name','Phone','Age','Gender','Diagnosis','Medicines','Tests','Fee','Tests Rs','Extra','Discount','Total','Paid','Balance']].concat(V.slice().sort((a,b)=>a.ts-b.ts).map(v=>[v.token,v.day,v.mr,v.name,v.ph,v.age,v.g,v.dx,(v.meds||[]).map(m=>m.n).join(' | '),(v.titems||[]).map(t=>t.n).join(' | '),v.fee||0,v.tsum||0,v.extra||0,v.disc||0,tot(v),pd(v),tot(v)-pd(v)]))))}
function restPick(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{RB=JSON.parse(r.result);if(RB.app!=='clinic')throw 0;$('#rbi').innerHTML=`Backup of ${new Date(RB.ts).toLocaleString()}: ${(RB.visits||[]).length} visits, ${(RB.patients||[]).length} patients. <button class="btn s r" onclick="restDo()">Restore now</button>`}catch(e){RB=null;$('#rbi').textContent='This is not a clinic backup file.'}};r.readAsText(f)}
async function restDo(){if(!RB)return;if(restDo.p!==1){restDo.p=1;toast('Tap Restore now again to confirm');return}restDo.p=0;let n=0;
 try{for(const k of ['visits','patients','meds','tpls','appts','exp','closings','logs'])for(const x of (RB[k]||[])){const {id,...d}=x;await db.collection(k).doc(id).set(d);n++}if(RB.settings)await db.doc('settings/main').set(RB.settings);logA('Backup restored ('+n+' records)');toast('Restored '+n+' records')}catch(e){toast('Restore failed')}}
const logHtml=()=>LG.slice(0,50).map(l=>`<div class="q"><div style="flex:1"><b style="font-size:13px">${esc(l.act)}</b><small>${esc(l.by)} · ${new Date(l.ts).toLocaleString()}</small></div></div>`).join('')||'<div class="empty">No activity yet.</div>';
function logRender(){const e=$('#lgc');if(e&&view==='adm'&&!typing())e.innerHTML=logHtml()}
function admExtra(){const s=S();return `<div class="card"><h2><i style="background:var(--sky)">✍</i>Doctor signature / stamp</h2>${s.sig?`<img src="${s.sig}" alt="" style="max-width:100%;max-height:90px;background:#fff;border-radius:8px;padding:4px"><br>`:'<small style="color:var(--mut)">Not added yet. It is shown on Rx and letters.</small>'}<input type="file" accept="image/*" onchange="sigUp(this)" style="margin-top:8px">${s.sig?'<button class="btn s r" style="margin-top:8px" onclick="sigDel()">Remove</button>':''}</div>
 <div class="card"><h2><i style="background:var(--teal)">💾</i>Backup and restore</h2><div style="display:grid;gap:8px"><button class="btn w" onclick="backup()">Full backup (JSON)</button><button class="btn t w" onclick="patCsv()">Patients list (CSV)</button><button class="btn t w" onclick="visCsv()">All visits (CSV)</button></div><label style="margin-top:10px">Restore from backup file<input type="file" accept=".json,application/json" onchange="restPick(this)"></label><div id="rbi" style="margin-top:8px;font-size:13px"></div></div>
 <div class="card"><h2><i style="background:var(--rose)">🕘</i>Activity log</h2><div id="lgc">${logHtml()}</div></div>`}
const rxTop=(s,v,ds,ls)=>`<div class="hd"><div class="hl"><div class="ti">${esc(s.title)}</div><h2>${esc(s.en)}</h2><div class="q1">${esc(s.enq)}</div><ul>${ls(s.enb)}</ul></div>
 <div class="lo"><svg width="72" height="72" viewBox="0 0 72 72"><circle cx="36" cy="36" r="30" fill="none" stroke="#123a6b" stroke-width="5"/><path d="M36 54C14 38 20 20 31 22C34 23 36 26 36 26C36 26 38 23 41 22C52 20 58 38 36 54Z" fill="#c0262d"/><path d="M20 38H30L34 30L39 44L43 36H52" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><b>${esc(s.clinic).toUpperCase()}</b></div>
 <div class="hr"><div class="ti">${esc(s.urt)}</div><h2>${esc(s.ur)}</h2><div class="ti" style="color:#0f766e">${esc(s.urq)}</div><ul>${ls(s.urb)}</ul></div></div>
 <div class="pl">Patient’s Name <u style="flex:3">${esc(v.name)}</u>MR <u style="flex:1.3">${esc(v.mr||'-')}</u>Age <u>${esc(v.age)} Y</u>Sex <u>${esc(v.g)}</u>Date <u>${ds}</u>Token <u style="flex:.5">${v.token}</u></div>
 `;
// ---------- erase patient record (code protected) ----------
function eraseOpen(id){const v=V.find(x=>x.id===id);if(!v)return;const n=V.filter(x=>x.id!==v.id&&((v.mr&&x.mr===v.mr)||(!v.mr&&pk(x)===pk(v)))).length+1;
 $('#bm').innerHTML=`<div class="card" style="max-width:460px;margin:30px auto"><h2><i style="background:var(--rose)">🗑</i>Erase patient record</h2><div class="warn" style="background:#fef2f2;color:#991b1b;border-color:#f43f5e">This permanently deletes the data from the cloud. It cannot be undone. Backup files downloaded earlier are not changed.</div>
 <div class="q"><div class="n">${v.token}</div><div style="flex:1"><b>${esc(v.name)}</b><small>${v.mr||'No MR'} · ${v.day}</small></div></div>
 <label style="display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--ink);font-size:14px"><input type="radio" name="es" value="v" checked>This visit only</label>
 <label style="display:flex;gap:8px;align-items:center;margin-bottom:8px;color:var(--ink);font-size:14px"><input type="radio" name="es" value="p">Entire patient: all ${n} visit${n>1?'s':''}, registry entry, appointments and activity-log lines</label>
 <label>Erase code<input id="er-c" type="password" autocapitalize="none"></label><div class="err" id="er-e"></div>
 <button class="btn r w" onclick="eraseGo('${id}')">Erase permanently</button><button class="btn o w" style="margin-top:8px" onclick="$('#bm').classList.remove('on')">Cancel</button></div>`;$('#bm').classList.add('on')}
async function eraseGo(id){const v=V.find(x=>x.id===id),E=t=>$('#er-e').textContent=t;if(!v)return;
 try{if(await sha($('#er-c').value.trim())!==RCH)return E('Wrong code');
  const whole=document.querySelector('input[name=es]:checked').value==='p',same=x=>(v.mr&&x.mr===v.mr)||(!v.mr&&pk(x)===pk(v)),vs=whole?V.filter(same):[v];let n=0;
  for(const x of vs){await db.collection('visits').doc(x.id).delete();n++}
  const left=V.filter(x=>same(x)&&!vs.some(y=>y.id===x.id)).length;
  if(v.mr&&(whole||!left))await db.collection('patients').doc(v.mr).delete();
  if(whole){const ph=String(v.ph||'').trim();if(ph.length>=7)for(const a of A.filter(a=>a.ph===ph))await db.collection('appts').doc(a.id).delete();
   for(const l of LG)if(v.mr?String(l.act).includes(v.mr):(v.name&&String(l.act).includes(v.name)))await db.collection('logs').doc(l.id).delete()}
  if(cv&&vs.some(x=>x.id===cv.id))cv=null;
  logA('Erased '+(whole?'patient ':'visit ')+(v.mr||('token '+v.token+' '+v.day))+' ('+n+' visit'+(n>1?'s':'')+')');
  $('#bm').classList.remove('on');toast('Record erased');rcd(true)}catch(e){E('Could not erase: '+(e&&e.message||'no access'))}}
// ---------- prescription ----------
function fq(f){const p=String(f).split('+'),n=['Morning','Noon','Night'];if(p.length!==3)return '<b style="display:inline;font-size:12px">'+esc(f)+'</b>';const l=p.map((x,i)=>+x?n[i]:'').filter(Boolean);return '<b style="display:inline;font-size:12px">'+esc(f)+'</b>'+(l.length?' ('+l.join(' · ')+')':'')}
function rxHTML(v){const s=S(),ex=v.ex||{},dt=new Date(v.ts),ds=dt.getDate()+'/'+(dt.getMonth()+1)+'/'+String(dt.getFullYear()).slice(2),ls=t=>String(t).split('\n').filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('');
 const adv=ADV.filter(a=>v.adv&&v.adv[a[0]]&&v.adv[a[0]].on),tmx=String(s.tm).split('\n');
 return `<div class="rx"><div class="bar"></div>${rxTop(s,v,ds,ls)}
 <div class="bd"><div class="sb"><div class="ci"><b>•</b> Hisotry &amp; Examination</div>${HX.map(h=>`<div class="ci ${v.hx&&v.hx[h[0]]?'on':''}"><b>•</b> ${h[1]} ${v.hx&&v.hx[h[0]]?'✔':''}</div>`).join('')}<hr>${[['BP','bp'],['HR','hr'],['Chest','chest'],['CVS','cvs']].map(x=>`<div class="ci"><b>•</b> ${x[0]}</div>`).join('')}<hr><div class="ci"><b>•</b> EF</div><div class="ci" style="margin-left:6px">Adv:</div>
 ${ADV.map(a=>{const on=v.adv&&v.adv[a[0]]&&v.adv[a[0]].on;return `<div class="ci ${on?'on':''}" style="font-size:10px;margin:2px 0 2px 8px"><b>${on?'☑':'☐'}</b> ${a[0]}</div>`}).join('')}
 <div class="ur">${esc(s.fac)}</div><div class="tm"><b>اوقات کار</b>${tmx.map(x=>esc(x)).join('<br>')}<div class="nv">Not Valid For Court</div></div></div>
 <div class="mn"><div class="rxs">Rx</div><div class="sec">Presentation / Diagnosis</div><div class="dx">${esc(v.dx||v.cc||'')}</div>
 ${algOn(v.allergy)?'<div class="sec" style="color:#c0262d">Allergy</div><div style="font-weight:700;color:#c0262d">'+esc(v.allergy)+'</div>':''}<div class="sec">Findings</div><div style="font-size:13px;line-height:1.7">BP: <b>${esc(ex.bp)}</b> mmHg &nbsp; Pulse: <b>${esc(ex.hr)}</b> bpm &nbsp; Chest: <b>${esc(ex.chest)}</b> &nbsp; CVS: <b>${esc(ex.cvs)}</b> &nbsp; EF: <b>${esc(ex.ef)}</b></div>
 ${adv.length?`<div class="sec">Adv:</div>${adv.map(a=>`<div style="font-size:13px"><b>${a[0]}</b> — ${esc(v.adv[a[0]].res)}</div>`).join('')}`:''}
 <div class="sec">Medicines</div>${(v.meds||[]).map(m=>`<div class="m"><b>${esc(m.n)} ${esc(m.d)}</b>${showGen(m)?'<em class="gn">Generic: '+esc(showGen(m))+'</em>':''}<span>${fq(m.f)} &nbsp;|&nbsp; ${esc(m.days)} days${m.i?' &nbsp;|&nbsp; '+esc(m.i):''}</span>${urLine(m)}</div>`).join('')||'—'}
 ${v.advice?`<div class="sec">Advice</div><div>${esc(v.advice)}</div>`:''}</div></div>
 <div class="fu">دوبارہ معائنہ کیلئے&nbsp;<b style="font-size:15px">${esc(v.follow||'____')}</b>&nbsp;دن بعد تشریف لائیں</div>
 ${sigBox(s)}<div class="ft"><span>☎ ${esc(s.ph)} &nbsp; ✆ ${esc(s.ph2)}</span><span class="u">${esc(s.addr)}</span></div></div>`}
let rxId=null;
function rxOpen(id){const v=cv&&cv.id===id?cv:V.find(x=>x.id===id);if(!v)return;rxId=id;$('#pv').innerHTML=rxHTML(v);$('#modal').classList.add('on');
 const k=Math.min(1,(innerWidth-20)/794);$('#pv').style.transform=`scale(${k})`;$('#pvw').style.width=794*k+'px';$('#pvw').style.height=1123*k+'px';$('#dl').onclick=()=>pdf(v)}
async function pdf(v){toast('Preparing PDF…');const h=document.createElement('div');h.style.cssText='position:fixed;left:0;top:0;z-index:-1;opacity:0;pointer-events:none';h.innerHTML=rxHTML(v);document.body.appendChild(h);
 try{await document.fonts.ready;const c=await html2canvas(h.firstChild,{scale:2,backgroundColor:'#fff',useCORS:true,width:794,height:1123,windowWidth:794});
  const p=new jspdf.jsPDF('p','mm','a4');p.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297);
  const dl=await claude.use('downloads');if(!dl){toast('Download not available here');return}
  await dl.save({filename:`Rx-${v.token}-${String(v.name).replace(/\W+/g,'_')}.pdf`,data:p.output('blob')});toast('PDF saved')}
 catch(e){if(!e||e.code!=='declined')toast('Could not create PDF')}finally{h.remove()}}
</script></body></html>
